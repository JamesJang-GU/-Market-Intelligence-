name: Alphaliner Update

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Basic Packages
        run: |
          pip install pandas requests numpy

      - name: Run Script
        run: |
          python alphaliner.py
