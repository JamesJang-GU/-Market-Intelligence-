name: Update Market Intelligence Dashboard

on:
  workflow_dispatch:  # GitHub 화면에서 수동 실행 버튼 활성화
  schedule:
    - cron: "0 22 * * *"  # 매일 KST 00:00 실행 (UTC 기준)

permissions:
  contents: write

jobs:
  crawl-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler and generate dashboard
        run: |
          python run_all.py

      - name: Check generated files
        run: |
          test -f index.html
          git status --short

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Auto: update data and dashboard [$(date -u +'%Y-%m-%d')]"
          git push
