`Alphaliner`, `TAC Index` 등 하위 폴더 크롤러 실행부터 `dashboard_generator.py`를 통한 메인 포털 생성, 그리고 자동 커밋/푸시까지 완벽하게 처리하는 **통합 워크플로우 YML 전체 코드**입니다.

`.github/workflows/` 폴더 내의 YML 파일(예: `market_intelligence_workflow.yml` 또는 기존 `alphaliner_workflow.yml`) 전체를 아래 코드로 교체해 주시면 됩니다.

---

```yaml
name: Market Intelligence Weekly Update

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 UTC 00:00 (한국시간 오전 09:00)
  workflow_dispatch:      # 수동 실행 버튼(Run workflow) 활성화

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      # 1. Alphaliner 크롤러 실행 (폴더 위치 자동 감지)
      - name: Run Alphaliner Crawler
        run: |
          if [ -f "Alphaliner/alphaliner.py" ]; then
            python "Alphaliner/alphaliner.py" --cron
          elif [ -f "alphaliner.py" ]; then
            python alphaliner.py --cron
          fi

      # 2. TAC Index 크롤러 실행
      - name: Run TAC Index Crawler
        run: |
          if [ -f "TAC Index/TAC_Index.py" ]; then
            python "TAC Index/TAC_Index.py" --cron
          fi

      # 3. 통합 메인 대시보드 포털 생성 (dashboard_generator.py 실행)
      - name: Generate Main Dashboard Portal
        run: |
          if [ -f "dashboard_generator.py" ]; then
            python dashboard_generator.py
          fi

      # 4. 새로 업데이트된 모든 DB 및 HTML 파일 커밋 & 푸시
      - name: Commit and Push All Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update market intelligence data and htmls" && git push)

```
