name: Weekly Market Intelligence Automation

on:
  schedule:
    # UTC 기준 일요일 15:00 (한국 시간 월요일 00:00)
    - cron: '0 15 * * 0'
  workflow_dispatch: # 수동 실행 가능하도록 설정

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run All Crawlers
        run: python run_all.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update data and dashboard [$(date +'%Y-%m-%d')]" && git push)
