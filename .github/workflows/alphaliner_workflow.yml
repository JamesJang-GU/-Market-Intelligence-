name: Alphaliner Weekly Update

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 실행
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. GitHub Runner에 Google Chrome 설치 (필수)
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 2. --cron 옵션을 반드시 붙여서 실행 (웹서버 무한대기 방지)
      - name: Run Crawler
        run: |
          python alphaliner.py --cron

      # 3. 변경된 DB 파일 Git Commit & Push
      - name: Commit and Push DB
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alphaliner_history.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update alphaliner_history.db" && git push)
